<div class="chat-shell">
  <h1>AllianzGPT (Microservice Demo)</h1>

  <div class="card">
    <label>Username</label>
    <input [(ngModel)]="username" placeholder="username" />
    <label>Password</label>
    <input type="password" [(ngModel)]="password" />
    <button (click)="login()">Login</button>
  </div>

  <div class="card">
    <textarea [(ngModel)]="queryText" placeholder="Ask your AllianzGPT question"></textarea>
    <button (click)="sendQuery()" [disabled]="!token">Send (real-time stream)</button>
  </div>

  <div class="chat-log">
    <div *ngFor="let line of chatLog">{{ line }}</div>
  </div>
</div>
