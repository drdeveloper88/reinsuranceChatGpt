version: '3.8'

services:
  # Ollama LLM Service (Free)
  ollama:
    image: ollama/ollama:latest
    container_name: insurance-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - insurance_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:11434/api/tags >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: insurance-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - insurance_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - LLM_TYPE=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - EMBEDDING_TYPE=sentence-transformer
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - VECTOR_DB_TYPE=chroma
      - CHROMA_PERSIST_DIR=/app/.chroma_data
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-key-change-in-production
      - CORS_ORIGINS=["http://localhost:4200", "http://localhost:3000", "http://frontend:80"]
    volumes:
      - ./backend/app:/app/app
      - chroma_data:/app/.chroma_data
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - insurance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ingest Service
  ingest:
    build:
      context: ./ingest_service
      dockerfile: Dockerfile
    container_name: insurance-ingest
    ports:
      - "8001:8001"
    environment:
      - BACKEND_INGEST_URL=http://backend:8000/api/ingest
      - ENVIRONMENT=production
    volumes:
      - ./ingest_service/app:/app/app
      - ./uploads:/app/uploads
    depends_on:
      - backend
    networks:
      - insurance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend (Angular)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insurance-frontend
    ports:
      - "4200:80"
    environment:
      - NGINX_HOST=frontend
      - NGINX_PORT=80
    depends_on:
      - backend
    networks:
      - insurance_network
    restart: unless-stopped

  # Chroma Vector DB (optional, for persistent vector storage)
  chroma:
    image: chromadb/chroma:latest
    container_name: insurance-chroma
    ports:
      - "8002:8000"
    environment:
      - PERSIST_DIRECTORY=/chroma/data
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000
    volumes:
      - chroma_server_data:/chroma/data
    networks:
      - insurance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  ollama_data:
  redis_data:
  chroma_data:
  chroma_server_data:

networks:
  insurance_network:
    driver: bridge
