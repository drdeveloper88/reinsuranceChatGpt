---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insurance-app
  namespace: insurance-chatbot

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insurance-app-role
  namespace: insurance-chatbot
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insurance-app-rolebinding
  namespace: insurance-chatbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: insurance-app-role
subjects:
- kind: ServiceAccount
  name: insurance-app
  namespace: insurance-chatbot

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insurance-deny-all-ingress
  namespace: insurance-chatbot
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insurance-allow-backend
  namespace: insurance-chatbot
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: ingest
    ports:
    - protocol: TCP
      port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insurance-allow-frontend
  namespace: insurance-chatbot
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insurance-allow-ollama
  namespace: insurance-chatbot
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 11434

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insurance-allow-redis
  namespace: insurance-chatbot
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 6379

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insurance-allow-ingest
  namespace: insurance-chatbot
spec:
  podSelector:
    matchLabels:
      app: ingest
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 8001
