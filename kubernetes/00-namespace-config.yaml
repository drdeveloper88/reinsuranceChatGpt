---
apiVersion: v1
kind: Namespace
metadata:
  name: insurance-chatbot

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insurance-config
  namespace: insurance-chatbot
data:
  ENVIRONMENT: "production"
  DEBUG: "False"
  LLM_TYPE: "ollama"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "mistral"
  EMBEDDING_TYPE: "sentence-transformer"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  VECTOR_DB_TYPE: "chroma"
  CHROMA_PERSIST_DIR: "/app/.chroma_data"
  REDIS_URL: "redis://redis:6379"
  RAG_TOP_K: "5"
  CHUNK_SIZE: "500"
  CHUNK_OVERLAP: "50"

---
apiVersion: v1
kind: Secret
metadata:
  name: insurance-secrets
  namespace: insurance-chatbot
type: Opaque
stringData:
  JWT_SECRET: "your-super-secret-key-change-in-production-$(date +%s)"
  OPENAI_API_KEY: ""  # Optional, only if using OpenAI

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: chroma-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/chroma

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/ollama

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/redis

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-pvc
  namespace: insurance-chatbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  volumeName: chroma-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: insurance-chatbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  volumeName: ollama-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: insurance-chatbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeName: redis-pv
